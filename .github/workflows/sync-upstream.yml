name: Sync upstream (safe)

on:
  schedule:
    - cron: '30 9 * * *'   # 3:00 pm India time
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    if: github.repository != 'Droid-Deck/DroidDeck'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - name: Check upstream (never pushes)
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN || github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          git config user.name "sync-bot"
          git config user.email "sync-bot@users.noreply.github.com"
          git remote add upstream https://github.com/Droid-Deck/DroidDeck.git
          git fetch upstream main --quiet

          BEHIND=$(git rev-list --count HEAD..upstream/main)
          if [ "$BEHIND" = "0" ]; then
            echo "already up to date, nothing to do"
            exit 0
          fi

          UP_SHA=$(git rev-parse --short upstream/main)
          BASE=$(git merge-base HEAD upstream/main)
          THEIRS=$(git diff --name-only "$BASE" upstream/main | sort)

          # your edited files
          FILES="
          app/src/main/java/com/droiddeck/launcher/gpu/Lossless.kt
          app/src/test/java/com/droiddeck/launcher/gpu/LosslessTest.kt
          app/src/main/java/com/droiddeck/launcher/ui/FrameGenMenu.kt
          app/src/main/res/values/strings.xml
          "
          LK=app/src/main/java/com/droiddeck/launcher/gpu/Lossless.kt
          LT=app/src/test/java/com/droiddeck/launcher/gpu/LosslessTest.kt
          FG=app/src/main/java/com/droiddeck/launcher/ui/FrameGenMenu.kt
          SX=app/src/main/res/values/strings.xml

          # prints changed line ranges (new side) for a file
          hunks() {
            local out
            out=$(git diff -U0 "$1" "$2" -- "$3" | grep '^@@' | sed -E 's/^@@ -[^ ]+ \+([^ ]+) @@.*/  lines \1/')
            if [ -z "$out" ]; then echo "  (none)"; else echo "$out"; fi
          }

          REPORT=report.md
          echo "# upstream sync report ($UP_SHA, $BEHIND new commits)" > $REPORT
          PROBLEM=0

          # 1) which of your files upstream also changed (info only)
          TOUCHED=""
          for f in $FILES; do
            if echo "$THEIRS" | grep -qx "$f"; then TOUCHED="$TOUCHED $f"; fi
          done
          {
            echo
            echo "## your files that upstream also changed"
            echo "(start,count = first line, number of lines. git merges by line, so edits far from yours are fine)"
            if [ -z "$TOUCHED" ]; then echo "none"; fi
            for f in $TOUCHED; do
              echo
              echo "### $f"
              echo "your changed lines:"
              hunks "$BASE" HEAD "$f"
              echo "upstream changed lines:"
              hunks "$BASE" upstream/main "$f"
            done
          } >> $REPORT

          # 2) test merge, nothing committed
          git merge --no-commit --no-ff upstream/main > merge.log 2>&1
          MERGE_RC=$?
          CONFLICTS=$(git diff --name-only --diff-filter=U)

          if [ -n "$CONFLICTS" ]; then
            PROBLEM=1
            {
              echo
              echo "## CONFLICTS (upstream changed the same lines as you)"
              for f in $CONFLICTS; do
                echo
                echo "### $f (line numbers are in the conflicted file)"
                echo '```'
                grep -nE '^(<<<<<<<|=======|>>>>>>>)' "$f"
                echo '```'
                echo "between <<<<<<< and ======= is YOUR version, between ======= and >>>>>>> is upstream"
              done
            } >> $REPORT
          elif [ $MERGE_RC -ne 0 ]; then
            PROBLEM=1
            { echo; echo "## merge failed without conflict markers"; echo '```'; cat merge.log; echo '```'; } >> $REPORT
          fi

          # 3) are all your edits still there after the test merge
          if [ -z "$CONFLICTS" ] && [ $MERGE_RC -eq 0 ]; then
            FAIL=""
            has()  { [ -f "$2" ] && grep -qF -- "$1" "$2" || FAIL="$FAIL\n- $3"; }
            hasnt() { [ -f "$2" ] && ! grep -qF -- "$1" "$2" || FAIL="$FAIL\n- $3"; }
            hasnt 'return ImportResult.NOT_OWNED' "$LK" "Lossless.kt: the NOT_OWNED early return is back"
            has 'markOwned(context)' "$LK" "Lossless.kt: markOwned(context) is missing"
            has 'importWorksWithoutPriorOwnership' "$LT" "LosslessTest.kt: your test is missing"
            hasnt 'if (lossless.owned) {' "$FG" "FrameGenMenu.kt: the owned gate is back"
            has 'Select Lossless.dll from your own copy' "$SX" "strings.xml: lsfg_import_not_owned text is missing"
            has 'Needs Lossless Scaling' "$SX" "strings.xml: lsfg_needs_steam text is missing"
            if [ -n "$FAIL" ]; then
              PROBLEM=1
              { echo; echo "## YOUR EDITS ARE NOT INTACT AFTER MERGE"; printf '%b\n' "$FAIL"; } >> $REPORT
            fi
          fi

          git merge --abort 2>/dev/null || git reset --hard HEAD

          # 4) report
          if [ $PROBLEM -eq 1 ]; then
            { echo; echo "## RESULT: NOT safe to merge. main was not changed."; } >> $REPORT
            TITLE="upstream NOT safe to merge ($UP_SHA)"
          else
            {
              echo
              echo "## RESULT: safe. the test merge is clean and all your edits are intact."
              echo
              echo "to merge: Actions > Sync merge (manual) > Run workflow > upstream_sha = $UP_SHA"
            } >> $REPORT
            TITLE="upstream safe to merge ($UP_SHA)"
          fi
          cat $REPORT
          if [ -z "$(gh issue list --repo "$REPO" --state open --search "$UP_SHA in:title" --json number --jq '.[0].number')" ]; then
            gh issue create --repo "$REPO" --title "$TITLE" --body-file $REPORT
          fi
